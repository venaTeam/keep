name: Build Developer Docs

on:
  pull_request:
    branches:
      - development
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write

jobs:
  build-developer-docs:
    # Only run if the source branch is docs/developer_docs
    if: github.head_ref == 'docs/developer_docs'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set lowercase repository owner
        id: repo-owner
        run: |
          REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${REPO_OWNER_LOWER}" >> $GITHUB_OUTPUT
          echo "Repository owner (lowercase): ${REPO_OWNER_LOWER}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Developer Docs image
        uses: docker/build-push-action@v4
        with:
          context: developer_docs
          file: developer_docs/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/developer-docs:${{ github.sha }}
