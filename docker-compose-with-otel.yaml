services:
  loki:
    image: grafana/loki:latest
    profiles:
      - otel

    ports:
      - "3100:3100"
    command: ["-config.file=/etc/loki/local-config.yaml"]

  tempo:
    image: grafana/tempo:latest
    profiles:
      - otel
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./otel-shared/tempo.yaml:/etc/tempo.yaml
      - ./tempo-data:/tmp/tempo
    ports:
      - "14268:14268" # jaeger ingest
      - "3200:3200" # tempo
      - "9095:9095" # tempo grpc
      - "4317:4317" # otlp grpc
      - "4318:4318" # otlp http
      - "9411:9411" # zipkin

  prometheus:
    image: prom/prometheus:latest
    profiles:
      - otel

    command:
      - --config.file=/etc/prometheus.yaml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./otel-shared/prometheus.yaml:/etc/prometheus.yaml
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager
    profiles:
      - otel

    container_name: alertmanager
    volumes:
      - ./otel-shared/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"

  grafana:
    image: grafana/grafana:10.0.3
    profiles:
      - otel

    depends_on:
      - loki
      - tempo
      - prometheus
    volumes:
      - ./otel-shared/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    ports:
      - "3001:3000"

  # OpenTelemetry collector - required for RUM metrics from browser
  # Also used by backend when METRIC_OTEL_ENABLED=true
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.81.0

    ports:
      - "9100:9100"
      - "4317:4317"   # OTLP gRPC (for backend)
      - "4318:4318"   # OTLP HTTP (for browser RUM via NGINX)
    volumes:
      - ./otel-shared/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml

  keep-frontend-dev:
    extends:
      file: docker-compose.common.yml
      service: keep-frontend-common
    environment:
      - API_URL=http://keep-backend-dev:8080
      - NEXT_PUBLIC_OTEL_COLLECTOR_URL=/otlp
    build:
      dockerfile: docker/Dockerfile.dev.ui
    volumes:
      - ./keep-ui:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - keep-backend-dev

  # NGINX reverse proxy - bridges HTTPS to HTTP for OTLP and frontend
  nginx-proxy:
    image: nginx:alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf
      # Mount SSL certs - generate self-signed for dev:
      # openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
      #   -keyout ./proxy/ssl/key.pem -out ./proxy/ssl/cert.pem -subj '/CN=localhost'
      - ./proxy/ssl:/etc/nginx/ssl
    depends_on:
      - keep-frontend-dev
      - otel-collector

  keep-backend-dev:
    extends:
      file: docker-compose.common.yml
      service: keep-backend-common
    build:
      dockerfile: docker/Dockerfile.dev.api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - OTEL_SERVICE_NAME=keephq
      - OTLP_ENDPOINT=http://otel-collector:4317
      - METRIC_OTEL_ENABLED=true
      - MESSAGING_TYPE=KAFKA
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_SECURITY_PROTOCOL=PLAINTEXT
      - DATABASE_CONNECTION_STRING=postgresql://keep:keep@postgres:5432/keep
    volumes:
      - .:/app
      - ./state:/state



  log_collector:
    image: timberio/vector:0.32.2-debian
    profiles:
      - otel
    volumes:
      - ./otel-shared/vector.toml:/etc/vector/vector.toml
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  certs:
    driver: local
  esdata01:
    driver: local
  kibanadata:
    driver: local

  db_data:
