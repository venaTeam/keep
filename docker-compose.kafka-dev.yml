# Local dev stack with Kafka for alert ingestion and real-time SSE
# Run: docker compose -f docker-compose.kafka-dev.yml up -d
# Frontend: cd keep-ui && npm run dev (uses API at http://localhost:8080)

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "22181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.4
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 60000
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 60000
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      start_period: 30s
      interval: 10s
      retries: 5

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: keep
      POSTGRES_USER: keep
      POSTGRES_PASSWORD: keep
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keep"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  keep-backend:
    extends:
      file: docker-compose.common.yml
      service: keep-backend-common
    build:
      dockerfile: docker/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      - AUTH_TYPE=NOAUTH
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
      - KEEP_METRICS=false
      - KEEP_OTEL_ENABLED=false
      - METRIC_OTEL_ENABLED=false
      - DATABASE_CONNECTION_STRING=postgresql://keep:keep@postgres:5432/keep
      - MESSAGING_TYPE=KAFKA
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS=false
      - SECRET_MANAGER_TYPE=FILE
      - SECRET_MANAGER_DIRECTORY=/state
    volumes:
      - .:/app
      - ./state:/state
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  keep-event-handler:
    build:
      dockerfile: docker/Dockerfile.event_handler
    environment:
      - AUTH_TYPE=NOAUTH
      - DATABASE_CONNECTION_STRING=postgresql://keep:keep@postgres:5432/keep
      - MESSAGING_TYPE=KAFKA
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KEEP_API_URL=http://keep-backend:8080
      - KEEP_OTEL_ENABLED=false
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keep-backend:
        condition: service_started

volumes:
  postgres_data:
