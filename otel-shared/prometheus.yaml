global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]
  - job_name: 'tempo'
    static_configs:
      - targets: [ 'tempo:3200' ]

  - job_name: 'wordpress'
    static_configs:
      - targets: [ 'otel-collector:9100' ]

  - job_name: 'keep'
    static_configs:
      - targets: [ 'host.docker.internal:8080' ]
    metrics_path: '/metrics'
