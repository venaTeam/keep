server {
    listen 443 ssl;
    server_name _;

    # SSL certificate configuration
    # Replace with your actual certificate paths
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Frontend proxy
    location / {
        proxy_pass http://keep-frontend-dev:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OTLP proxy for browser RUM telemetry (HTTPS -> HTTP bridge)
    # Browser sends to /otlp/v1/metrics, NGINX proxies to collector's HTTP port
    location /otlp/ {
        proxy_pass http://otel-collector:4318/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OTLP uses POST with potentially large payloads
        client_max_body_size 5m;
    }
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
